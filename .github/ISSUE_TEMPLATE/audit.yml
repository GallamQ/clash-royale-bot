name: Audit finding
description: A finding from a code, security or documentation audit
labels: [audit]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules (jokers, freeze, switch)
        - Database and migrations
        - systemd timers and services
        - Security and secrets
        - Tests
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What was found, and where (file, line, document).
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
